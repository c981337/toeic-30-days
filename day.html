<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>每日五科｜TOEIC 30</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand-mini" href="index.html">TOEIC <span>30</span></a>
      <nav class="nav-days">
        <a class="btn btn-ghost btn-sm" id="nav-prev" href="#">上一天</a>
        <a class="btn btn-ghost btn-sm" href="index.html">進度地圖</a>
        <a class="btn btn-ghost btn-sm" id="nav-next" href="#">下一天</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <header class="day-header">
      <p class="eyebrow" id="day-eyebrow">Week</p>
      <h1 id="day-title">Day</h1>
      <p id="day-sub"></p>
    </header>

    <p class="week-tip" id="week-tip" hidden></p>

    <div class="pillar-track" id="pillar-track" aria-label="五科完成狀態"></div>

    <div class="tabs" role="tablist">
      <button type="button" class="tab is-active" data-panel="panel-vocab">1 單字</button>
      <button type="button" class="tab" data-panel="panel-speak">2 朗讀</button>
      <button type="button" class="tab" data-panel="panel-listen">3 聽力</button>
      <button type="button" class="tab" data-panel="panel-grammar">4 文法</button>
      <button type="button" class="tab" data-panel="panel-read">5 閱讀</button>
    </div>

    <!-- 1 單字 -->
    <section class="panel is-active" id="panel-vocab">
      <div class="panel-card">
        <p class="module-lead">約 20 分｜先翻卡辨識，不懂的按「再複習」。可用朗讀聽單字與例句。</p>
        <div class="flash-card" id="flash-card" title="點擊翻面">
          <div class="flash-inner">
            <p class="flash-word" id="flash-word">—</p>
            <p class="flash-sub" id="flash-sub"></p>
            <p class="flash-example" id="flash-example"></p>
          </div>
        </div>
        <div id="flash-done" hidden>
          <p class="score-banner" style="margin:0">單字卡完成。可重開全部或只練錯字。</p>
        </div>
        <div class="controls">
          <button type="button" class="btn btn-ghost btn-sm" id="flash-speak">朗讀此字</button>
          <button type="button" class="btn btn-ghost btn-sm" id="flash-again">再複習</button>
          <button type="button" class="btn btn-primary btn-sm" id="flash-known">認識了</button>
          <button type="button" class="btn btn-ghost btn-sm" id="flash-restart">重開全部</button>
          <button type="button" class="btn btn-ghost btn-sm" id="flash-restart-wrong">只練錯字</button>
          <span class="progress-text" id="flash-progress">1 / 1</span>
        </div>
      </div>
    </section>

    <!-- 2 朗讀 -->
    <section class="panel" id="panel-speak">
      <div class="tts-bar">
        <button type="button" class="btn btn-primary btn-sm" id="speak-play">播放跟讀</button>
        <button type="button" class="btn btn-ghost btn-sm" id="speak-pause">暫停</button>
        <button type="button" class="btn btn-ghost btn-sm" id="speak-resume">繼續</button>
        <button type="button" class="btn btn-ghost btn-sm" id="speak-stop">停止</button>
        <label>語速 <input id="speak-rate" type="range" min="0.75" max="1.15" step="0.05" /> <span id="speak-rate-label">0.90×</span></label>
        <label>語音 <select id="speak-voice"></select></label>
      </div>
      <div class="panel-card">
        <p class="module-lead" id="speak-tip">約 15 分｜聽一句跟讀一句；第二遍可加快語速。</p>
        <article class="article" id="speak-text"></article>
        <div class="controls">
          <button type="button" class="btn btn-primary" id="mark-speak">完成朗讀</button>
        </div>
      </div>
    </section>

    <!-- 3 聽力 -->
    <section class="panel" id="panel-listen">
      <div class="agenda-box" id="listen-brief"></div>
      <div class="tts-bar">
        <button type="button" class="btn btn-primary btn-sm" id="listen-play">播放聽力音檔（本站 TTS）</button>
        <button type="button" class="btn btn-ghost btn-sm" id="listen-stop">停止</button>
        <span class="meta-chip">先聽再答，盡量先不要看閱讀區原文</span>
      </div>
      <div class="panel-card">
        <p class="module-lead">約 40 分｜先做本站聽後 4 題，再依下方指引做外部 Part 練習。</p>
        <div class="score-banner" id="listen-banner" hidden></div>
        <div id="listen-root"></div>
        <div class="controls">
          <button type="button" class="btn btn-primary" id="listen-submit">交卷</button>
          <button type="button" class="btn btn-ghost" id="listen-reset">重做聽力題</button>
        </div>
      </div>
    </section>

    <!-- 4 文法 -->
    <section class="panel" id="panel-grammar">
      <div class="agenda-box" id="grammar-brief"></div>
      <div class="panel-card">
        <p class="module-lead">約 25 分｜Part 5 風格，限時感作答後再看解析。</p>
        <div class="score-banner" id="grammar-banner" hidden></div>
        <div id="grammar-root"></div>
        <div class="controls">
          <button type="button" class="btn btn-primary" id="grammar-submit">交卷</button>
          <button type="button" class="btn btn-ghost" id="grammar-reset">重做文法題</button>
        </div>
      </div>
    </section>

    <!-- 5 閱讀 -->
    <section class="panel" id="panel-read">
      <div class="panel-card">
        <p class="module-lead">約 45 分｜先限時讀英文 → 做 5 題 → 再打開翻譯對照。</p>
        <div class="controls" style="margin-top:0;margin-bottom:1rem">
          <button type="button" class="btn btn-ghost btn-sm" id="toggle-zh">顯示翻譯</button>
          <button type="button" class="btn btn-ghost btn-sm" id="timer-toggle">開始計時</button>
          <span class="progress-text" id="timer-display">00:00</span>
          <button type="button" class="btn btn-primary btn-sm" id="mark-read">標記讀完</button>
        </div>
        <article class="article" id="article-en"></article>
        <div class="translation" id="article-zh" hidden></div>
      </div>
      <div class="panel-card" style="margin-top:1rem">
        <h3 class="inline-title">閱讀理解</h3>
        <div class="score-banner" id="quiz-banner" hidden></div>
        <div id="quiz-root"></div>
        <div class="controls">
          <button type="button" class="btn btn-primary" id="quiz-submit">交卷看解析</button>
          <button type="button" class="btn btn-ghost" id="quiz-reset">重做閱讀題</button>
        </div>
      </div>
    </section>
  </main>

  <script src="data/days.js"></script>
  <script src="data/curriculum.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/flashcards.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/day.js"></script>
</body>
</html>
